        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Trips]
      operationId: updateTrip
      summary: 修改 Trip
      description: 縮短日期範圍時，落在新範圍之外的行程項目必須先移動或刪除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: 更新後的 Trip
          content:
