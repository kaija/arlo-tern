        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 這個項目已經處理過或已被取代（`proposal_not_pending`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
