openapi: 3.1.0
info:
  title: Arlo Tern Core API
  version: 0.1.0
  summary: 核心服務對 App 提供的 API，以及 LINE 與 WhatsApp 官方帳號的 webhook 端點。
  description: |
    本文件定義核心服務（core）對外的 HTTP 介面，範圍是 MVP（100 人以下內測）。
    設計依據見 `docs/design/system-design.md` 與 `docs/adr/`。

    ## 慣例

    - **用戶範圍**：路徑與請求內容都沒有用戶識別碼，用戶一律從 access token 取得。
      存取不屬於自己的資源一律回 `404`。
    - **錯誤**：一律回 `application/problem+json`，其中 `code` 是機器可讀的錯誤碼。
    - **分頁**：游標分頁。請求帶 `limit` 與 `cursor`，回應帶 `nextCursor`；
      `nextCursor` 為 `null` 表示沒有下一頁。
    - **時間**：時間點用 ISO 8601 UTC（`date-time`）；日期用 `YYYY-MM-DD`；
      當地時間用 `HH:mm`，並搭配明確的時區欄位解讀。
    - **原文**：task、待確認項目、可疑訊息警告、記憶、通知的資料結構都不含 LINE 訊息原文。
      各資源的 `/source` 端點會回傳原文，而且只在訊息保存期內有效。
      另一個例外是 agent 對話：agent 檢索歷史訊息後，回覆中可能引用原文。

    ## 閘門錯誤

    - `not_invited`：內測階段，該 Google 帳號不在邀請名單內。
    - `consent_required`：缺少必要的同意，或同意的文件已改版。
      回應的 `requiredConsents` 列出需要同意的文件與版本。

    ## 不在本文件範圍

    - 核心服務與讀取服務（connector）之間的內部控制介面。
    - 資料匯出：內測期間由人工處理，沒有對應的端點。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{host}/v1
    description: 部署環境。本機開發時把 host 換成本機的位址與埠。
    variables:
      host:
        default: api.invalid
        description: 主機名稱。正式的網域尚未決定，預設值只是占位。
tags:
  - name: Auth
    description: 以 Google 登入，後端簽發自己的 token。
  - name: Consent
    description: 同意文件與同意紀錄。
  - name: Account
    description: 帳號、設定、裝置與推播 token。
  - name: LINE Connection
    description: 連結與中斷個人 LINE 帳號（只讀）。
  - name: Conversations
    description: 對話清單與讀取範圍。
  - name: Calendar
    description: 行事曆檢視用的彙整查詢。
  - name: Tasks
    description: Task、提醒、變更紀錄與來源訊息。
  - name: Task Proposals
    description: 待確認清單，包含低信心的新 task 與對既有 task 的修改或取消建議。
  - name: Scam Alerts
    description: 可疑訊息警告。
  - name: Trips
    description: 旅遊行程與行程項目。
  - name: Agent
    description: 與個人 AI agent 的對話，以及 agent 的記憶條目。
  - name: OA Bindings
    description: 把 LINE 或 WhatsApp 官方帳號上的用戶綁定到 App 帳號。
  - name: Notifications
    description: App 內的通知中心。
  - name: Webhooks
    description: 由 LINE 與 Meta 呼叫的端點，以簽章驗證，不使用 bearer token。
security:
  - bearerAuth: []
paths:
  /auth/google:
    post:
      tags: [Auth]
      operationId: signInWithGoogle
      summary: 以 Google ID token 登入或註冊
      description: |
        後端驗證 ID token 的簽章、簽發者、對象與有效期，並以 Google 帳號的 `sub`
        找到或建立 App 帳號。

        首次登入必須在 `acceptedConsents` 附上必要的同意；沒有附或不完整時回
        `403 consent_required`，帳號不會建立。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: ID token 無效或已過期（`invalid_id_token`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 不在邀請名單（`not_invited`），或缺少必要的同意（`consent_required`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: 以 refresh token 換發新的 token
      description: |
        每次使用都會輪替 refresh token。已輪替的舊 token 再次被使用時，
        該裝置的整串 token 都會被撤銷，回 `401 token_reuse_detected`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 換發成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: refresh token 無效、過期或被重用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: signOut
      summary: 登出目前的裝置
      description: 撤銷目前裝置的 refresh token，並刪除該裝置的推播 token。
      responses:
        '204':
          description: 已登出
        '401':
          $ref: '#/components/responses/Unauthorized'
  /consent-documents:
    get:
      tags: [Consent]
      operationId: listConsentDocuments
      summary: 取得各類同意文件的現行版本
      description: 不需要登入，供首次登入前顯示文件。
      security: []
      responses:
        '200':
          description: 現行的同意文件
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: 取得目前用戶與待處理的同意
      responses:
        '200':
          description: 目前用戶
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/consents:
    get:
      tags: [Consent]
      operationId: listMyConsents
      summary: 列出我的同意紀錄
      responses:
        '200':
          description: 同意紀錄，新的在前
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Consent]
      operationId: acceptConsent
      summary: 同意某份文件的現行版本
      description: 文件改版後，用這個端點重新同意。`version` 必須是該類型的現行版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentAcceptance'
      responses:
        '201':
          description: 已記錄同意
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 送出的版本不是現行版本（`consent_version_outdated`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/settings:
    get:
      tags: [Account]
      operationId: getSettings
      summary: 取得設定
      responses:
        '200':
          description: 目前的設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Account]
      operationId: updateSettings
      summary: 更新設定
      description: |
        只需要送出要變更的欄位。縮短 `retentionDays` 後，下一次的每日清除就會套用新的期限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: 更新後的設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/deletion:
    post:
      tags: [Account]
      operationId: requestAccountDeletion
      summary: 刪除帳號
      description: |
        需要附上新取得的 Google ID token 作為再次確認。

        接受請求後立即撤銷所有 token。背景工作接著中斷 LINE 連結（登出連結裝置、
        刪除憑證），並刪除該用戶的所有資料與官方帳號綁定。這個操作無法復原。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: 已接受，刪除在背景進行
        '401':
          description: 未登入，或 ID token 無效、與目前帳號不符
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/devices/{deviceId}/push-token:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    put:
      tags: [Account]
      operationId: registerPushToken
      summary: 註冊或更新裝置的推播 token
      description: App 每次啟動與 FCM registration token 更新時呼叫。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRequest'
      responses:
        '204':
          description: 已儲存
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Account]
      operationId: deletePushToken
      summary: 刪除裝置的推播 token
      responses:
        '204':
          description: 已刪除，或原本就不存在
        '401':
          $ref: '#/components/responses/Unauthorized'
  /line/connection:
    get:
      tags: [LINE Connection]
      operationId: getLineConnection
      summary: 取得個人 LINE 帳號的連結狀態
      responses:
        '200':
          description: 連結狀態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [LINE Connection]
      operationId: disconnectLine
      summary: 中斷 LINE 連結
      description: |
        立即停止讀取、登出 LINE 上的連結裝置、刪除保存的憑證。
        task、行程、記憶會保留。
      parameters:
        - name: deleteMessages
          in: query
          description: 是否一併刪除已保存的原始訊息。
          schema:
            type: boolean
            default: true
      responses:
        '202':
          description: 已接受，中斷連結在背景進行
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 目前沒有連結（`line_not_linked`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /line/link-sessions:
    post:
      tags: [LINE Connection]
      operationId: createLineLinkSession
      summary: 開始連結個人 LINE 帳號
      description: |
        建立一個連結流程。連結是非同步的：App 以 `GET /line/link-sessions/{linkSessionId}`
        輪詢狀態，依狀態顯示 QR code 或驗證碼。

        用戶必須已同意現行版本的 LINE 非官方連線風險告知，否則回 `403 consent_required`。
      responses:
        '201':
          description: 已建立連結流程
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineLinkSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ConsentRequired'
        '409':
          description: 已經連結（`line_already_linked`），或已有進行中的連結流程（`link_session_in_progress`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 讀取服務暫時無法使用（`connector_unavailable`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /line/link-sessions/{linkSessionId}:
    parameters:
      - $ref: '#/components/parameters/LinkSessionId'
    get:
      tags: [LINE Connection]
      operationId: getLineLinkSession
      summary: 取得連結流程的狀態
      responses:
        '200':
          description: 連結流程
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineLinkSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [LINE Connection]
      operationId: cancelLineLinkSession
      summary: 取消連結流程
      responses:
        '204':
          description: 已取消，或流程已經結束
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: 列出 LINE 對話與各自的讀取設定
      description: |
        包含所有已知的對話。未被讀取的對話（例如未 opt-in 的官方帳號）只有名稱與類型，
        系統沒有保存它們的訊息。
      parameters:
        - name: type
          in: query
          description: 依對話類型篩選。
          schema:
            $ref: '#/components/schemas/ConversationType'
        - name: ingestionEnabled
          in: query
          description: 依目前是否被讀取篩選。
          schema:
            type: boolean
        - name: q
          in: query
          description: 以名稱搜尋。
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 對話清單
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    patch:
      tags: [Conversations]
      operationId: updateConversation
      summary: 變更對話的讀取設定
      description: |
        - 一般帳號與群組預設讀取：送 `false` 可以排除。
        - 其他官方帳號預設不讀取：送 `true` 可以 opt-in。
        - 送 `null` 回到該類型的預設值。

        把對話改成不讀取時，系統會刪除該對話已保存的原始訊息，之後 agent 也查不到它們；
        由這些訊息產生的 task 與警告會保留，但來源訊息不再可用。
        把對話改成讀取時，只會讀取之後收到的訊息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationUpdate'
      responses:
        '200':
          description: 更新後的對話
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /calendar:
    get:
      tags: [Calendar]
      operationId: getCalendar
      summary: 取得日期範圍內的 task、Trip 與行程項目
      description: |
        供日、週、月檢視使用。回傳與範圍重疊的 Trip、範圍內的行程項目，
        以及範圍內狀態不是 `cancelled` 的 task。待確認清單的項目不在其中。
      parameters:
        - name: from
          in: query
          required: true
          description: 起始日期（含）。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 結束日期（含）。與 `from` 的間隔最多 62 天。
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 範圍內的行事曆資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: 列出 task
      parameters:
        - name: from
          in: query
          description: 只回傳日期在此之後（含）的 task。
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: 只回傳日期在此之前（含）的 task。
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: 依狀態篩選。
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: tripId
          in: query
          description: 只回傳關聯到指定 Trip 的 task。
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: task 清單，依日期與時間排序
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: 手動建立 task
      description: |
        用戶建立的 task 之後不會被 AI 自動覆蓋。

        `reminderMode` 決定提醒怎麼產生：`ai` 由 AI 依任務性質決定並套用系統護欄；
        `manual` 使用 `reminders` 內的時間；`none` 不設提醒。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: 取得 task
      responses:
        '200':
          description: task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: 修改 task
      description: |
        只需要送出要變更的欄位。修改後這個 task 會標記為用戶修改過，
        之後 AI 對它的修改與取消都只會成為待確認的建議。

        日期或時間變更時，尚未發出的 AI 提醒會重新產生；用戶手動調整過的提醒依相同提前量平移。
        狀態改成 `completed` 或 `cancelled` 時，尚未發出的提醒會取消。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: 更新後的 task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: 刪除 task
      description: 永久刪除 task 與它的提醒、變更紀錄。只想取消的話，改用 `PATCH` 把狀態設成 `cancelled`。
      responses:
        '204':
          description: 已刪除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/source:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTaskSource
      summary: 取得 task 的來源訊息與前後文
      description: |
        回傳產生這個 task 的 LINE 訊息與前後數則。只在訊息保存期內有效。
      responses:
        '200':
          description: 來源訊息與前後文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: task 不存在，或這個 task 沒有來源訊息（例如手動建立的）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          $ref: '#/components/responses/SourceExpired'
  /tasks/{taskId}/reminders:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskReminders
      summary: 列出 task 的提醒
      responses:
        '200':
          description: 提醒清單，依時間排序
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reminder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tasks]
      operationId: createTaskReminder
      summary: 新增提醒
      description: |
        用戶設定的提醒時間必須晚於現在、不晚於 task 的到期時間，
        而且每個 task 的提醒數有上限。用戶自己設定的時間不受勿擾時段限制。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderInput'
      responses:
        '201':
          description: 已新增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 已達每個 task 的提醒數上限（`reminder_limit_reached`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{taskId}/reminders/{reminderId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ReminderId'
    patch:
      tags: [Tasks]
      operationId: updateTaskReminder
      summary: 修改提醒時間
      description: 修改後這個提醒會標記為用戶調整過。已發出的提醒不能修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderInput'
      responses:
        '200':
          description: 更新後的提醒
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 提醒已經發出或已取消（`reminder_not_editable`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Tasks]
      operationId: deleteTaskReminder
      summary: 關閉提醒
      responses:
        '204':
          description: 已關閉
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/changes:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskChanges
      summary: 列出 task 的變更紀錄
      description: 包含管線自動套用的變更、agent 的修改與用戶的修改，新的在前。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 變更紀錄
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskChange'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/changes/{changeId}/revert:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/ChangeId'
    post:
      tags: [Tasks]
      operationId: revertTaskChange
      summary: 還原一筆變更
      description: |
        把 task 還原成該筆變更之前的值。還原本身會產生一筆新的變更紀錄，
        並把 task 標記為用戶修改過。只能還原最新的一筆尚未還原的變更。
      responses:
        '200':
          description: 還原後的 task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 這筆變更已還原，或之後還有其他變更（`change_not_revertible`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /task-proposals:
    get:
      tags: [Task Proposals]
      operationId: listTaskProposals
      summary: 列出待確認清單
      parameters:
        - name: status
          in: query
          description: 依狀態篩選，預設只回傳 `pending`。
          schema:
            $ref: '#/components/schemas/ProposalStatus'
        - name: kind
          in: query
          description: 依建議的類型篩選。
          schema:
            $ref: '#/components/schemas/ProposalKind'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 待確認項目，新的在前
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskProposal'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /task-proposals/{proposalId}:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    get:
      tags: [Task Proposals]
      operationId: getTaskProposal
      summary: 取得待確認項目
      responses:
        '200':
          description: 待確認項目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /task-proposals/{proposalId}/source:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    get:
      tags: [Task Proposals]
      operationId: getTaskProposalSource
      summary: 取得待確認項目的來源訊息與前後文
      responses:
        '200':
          description: 來源訊息與前後文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/SourceExpired'
  /task-proposals/{proposalId}/accept:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Task Proposals]
      operationId: acceptTaskProposal
      summary: 接受待確認項目
      description: |
        依建議的類型建立、修改或取消 task。可以在 `overrides` 先調整建議的內容再套用。
        接受後的 task 視同用戶修改過。

        提醒在接受的當下才產生：以接受時的時間重新決定提醒並套用系統護欄，
        不沿用建議產生當時算出的提醒時間。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalAcceptRequest'
      responses:
        '200':
          description: 已套用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalAcceptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 這個項目已經處理過或已被取代（`proposal_not_pending`）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /task-proposals/{proposalId}/reject:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [Task Proposals]
      operationId: rejectTaskProposal
      summary: 拒絕待確認項目
      responses:
        '200':
          description: 已拒絕
          content:
